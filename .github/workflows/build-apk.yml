# Goal Tracker Shell - APK build
#
# The Gradle wrapper (gradlew, gradlew.bat, gradle/wrapper/gradle-wrapper.jar)
# is now INCLUDED in the repository, so no generation step is needed.
#
# What this workflow does, in order:
#   1. On the FIRST run only: creates a permanent signing keystore and
#      commits it to the repo. NEVER delete signing/release.keystore -
#      it is what lets every future APK install as an update over the
#      old one without losing data. Keep this repository PRIVATE.
#   2. Builds a signed release APK.
#   3. Uploads the APK as a downloadable artifact.
#
# How to download the APK after a successful run:
#   GitHub repo -> Actions tab -> click the finished run -> "Artifacts"
#   section at the bottom -> download "goal-tracker-apk" -> unzip it ->
#   copy app-release.apk to your phone and install.

name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create permanent signing keystore (first run only)
        run: |
          if [ ! -f signing/release.keystore ]; then
            mkdir -p signing
            keytool -genkeypair -v \
              -keystore signing/release.keystore \
              -alias goaltracker \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass goaltracker-shell -keypass goaltracker-shell \
              -dname "CN=Goal Tracker, OU=Personal, O=Personal, L=Home, S=Home, C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f signing/release.keystore
            git commit -m "ci: add permanent signing keystore [skip ci]"
            git push
          fi

      # The Gradle wrapper downloads its own distribution from GitHub's release CDN on
      # every fresh runner. That endpoint answers 5xx intermittently, and when it does
      # ./gradlew dies within seconds with the distribution URL as its only error
      # (exit 1, no compiler output). Caching the unpacked distribution means later
      # runs never touch that CDN at all.
      - name: Cache the Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-8.2-bin

      # Even with the cache, a first run (or an evicted cache) can still hit the CDN.
      # Retry with a cleared dists directory, so a half-written download can never
      # poison the next attempt.
      - name: Build signed release APK
        run: |
          for attempt in 1 2 3; do
            echo "::group::Gradle attempt $attempt"
            if ./gradlew assembleRelease --no-daemon --stacktrace; then
              echo "::endgroup::"
              echo "Build succeeded on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            rm -rf "$HOME/.gradle/wrapper/dists"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          echo "Gradle build failed after 3 attempts"
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goal-tracker-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
